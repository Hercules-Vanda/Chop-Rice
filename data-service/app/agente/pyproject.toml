[project]
name = "agente"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hercules_Vanda", email = "herculesvanda55@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "agentspan>=0.2.0",
    "fastapi>=0.139.0",
    "flask>=3.1.3",
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.50.2",
]

[project.scripts]
agente = "agente:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
